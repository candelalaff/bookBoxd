<div class="container my-4">
  <!-- Encabezado con botón de cerrar sesión -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Catálogo de Libros</h2>
    <button class="btn btn-outline-danger" (click)="logout()">Cerrar Sesión</button>
    </div>
    
    <!-- Indicador de carga -->
    <div *ngIf="cargando" class="text-center my-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
      <p class="mt-2">Cargando catálogo desde Google Books...</p>
    </div>
    
    <!-- Grilla de Libros traídos de la API -->
    <div *ngIf="!cargando" class="row">
      <div class="col-md-4 col-lg-3 mb-4" *ngFor="let libro of librosGoogle">
        <div class="card h-100 shadow-sm">
    
          <!-- Portada traída desde Google Books -->
          <img [src]="libro.volumeInfo?.imageLinks?.thumbnail || 'https://via.placeholder.com/128x192?text=Sin+Portada'"
            class="card-img-top p-2" alt="{{ libro.volumeInfo?.title }}"
            style="height: 260px; object-fit: contain; background-color: #f8f9fa;">
    
          <div class="card-body d-flex flex-column">
            <h6 class="card-title text-truncate fw-bold" title="{{ libro.volumeInfo?.title }}">
              {{ libro.volumeInfo?.title }}
            </h6>
          
          <p class="card-text text-muted small mb-2">
            {{ libro.volumeInfo?.authors ? libro.volumeInfo.authors.join(', ') : 'Autor no disponible' }}
          </p>
          
          <div class="mt-auto">
            <button class="btn btn-sm btn-primary w-100">
              Ver Detalle / Puntuar
            </button>
          </div>
          </div>
</div>
</div>
</div>

</div>
