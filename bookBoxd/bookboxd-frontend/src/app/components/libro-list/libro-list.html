<div style="max-width: 1000px; margin: 0 auto; padding: 20px; font-family: sans-serif;">
  
  <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ccc; padding-bottom: 10px;">
    <h2>BookBoxd - Catálogo</h2>
    <button (click)="logout()" style="padding: 8px 12px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;">Cerrar Sesión</button>
  </div>

  <!-- Buscador -->
  <div style="margin: 20px 0; display: flex; gap: 10px;">
    <input 
      type="text" 
      [(ngModel)]="terminoBusqueda" 
      (keyup.enter)="cargarLibros()"
      placeholder="Buscar por título o autor..." 
      style="flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px;"
    />
    <button 
      (click)="cargarLibros()" 
      style="padding: 10px 20px; background: #1B4D3E; color: white; border: none; border-radius: 4px; cursor: pointer;">
      Buscar
    </button>
  </div>

  <!-- Estados de carga y error -->
  <div *ngIf="cargando" style="text-align: center; margin: 20px 0; color: #666;">
    Cargando resultados...
  </div>
  
  <div *ngIf="mensajeError" style="background: #f8d7da; color: #721c24; padding: 10px; border-radius: 4px;">
    {{ mensajeError }}
  </div>

  <!-- Grilla de Libros -->
  <div *ngIf="!cargando && librosGoogle.length > 0" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px;">
    
    <div *ngFor="let libro of librosGoogle" style="border: 1px solid #eee; border-radius: 8px; padding: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
      <!-- Mostramos la portada si Google Books la devuelve -->
      <!-- Mostramos la portada si Google Books la devuelve -->
      <img 
        *ngIf="libro.volumeInfo?.imageLinks?.thumbnail" 
        [src]="libro.volumeInfo?.imageLinks?.thumbnail" 
        alt="Portada de {{ libro.volumeInfo?.title }}"
        style="max-width: 100%; height: auto; border-radius: 4px; margin-bottom: 10px;"
      />
      <!-- Si no hay portada, mostramos un cuadradito gris -->
      <div *ngIf="!libro.volumeInfo?.imageLinks?.thumbnail" style="width: 100%; height: 200px; background-color: #eee; border-radius: 4px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; color: #999;">
        Sin portada
      </div>

      <h3 style="font-size: 16px; margin: 0 0 5px 0;">{{ libro.volumeInfo?.title }}</h3>
      <p style="font-size: 14px; color: #666; margin: 0;">{{ libro.volumeInfo?.authors ? libro.volumeInfo?.authors.join(', ') : 'Autor desconocido' }}</p>
    </div>

  </div>

  <!-- Mensaje si no hay resultados -->
  <div *ngIf="!cargando && librosGoogle.length === 0 && !mensajeError" style="text-align: center; margin: 20px 0; color: #666;">
    No se encontraron libros. Probá con otra búsqueda.
  </div>

</div>
