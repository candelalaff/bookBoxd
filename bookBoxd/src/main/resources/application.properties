spring.application.name=bookBoxd

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuracion de base de datos H2
spring.datasource.url=jdbc:h2:file:./bookboxd_db;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Clave secreta fija para firmar los JWT (debe tener al menos 32 caracteres/256 bits para HS256)
app.jwt.secret=MiClaveSecretaSuperSeguraParaBookBoxd2026SistemaDeLibros