spring.application.name=bookBoxd
server.port=8085

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuracion de base de datos H2
spring.datasource.url=jdbc:h2:file:./bookboxd_db;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Clave secreta interna del backend para firmar y validar los tokens JWT.
# No es la contrasena de ningun usuario: es un "sello" propio de la aplicacion.
# Debe quedar fija (no cambiarla en cada reinicio) para que los tokens sigan siendo validos.
app.jwt.secret=8f3a1c9d7e2b4f6a0c5d8e1b3f7a9c2d4e6f8a0b1c3d5e7f9a2b4c6d8e0f1a3b